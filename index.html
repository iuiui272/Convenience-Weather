<style>
/* Convenience — Apple-style weather. System fonts only, no external requests. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --muted: rgba(255, 255, 255, .62);
  --glass: rgba(24, 36, 58, .27);
  --spring: cubic-bezier(.32, .72, 0, 1);
  --bar-h: 58px;
  /* menus (sheets + sidebar) */
  --sheet: rgba(30, 30, 34, .88); --sx: #fff; --sm: rgba(255, 255, 255, .58); --sl: rgba(255, 255, 255, .12);
  --sf: rgba(255, 255, 255, .1); --sfo: rgba(255, 255, 255, .24);
}
html[data-theme="light"] { --sheet: rgba(246, 246, 249, .92); --sx: #111; --sm: rgba(60, 60, 67, .62); --sl: rgba(60, 60, 67, .14); --sf: rgba(60, 60, 67, .08); --sfo: #fff; }
@media (prefers-color-scheme: light) {
  html:not([data-theme]) { --sheet: rgba(246, 246, 249, .92); --sx: #111; --sm: rgba(60, 60, 67, .62); --sl: rgba(60, 60, 67, .14); --sf: rgba(60, 60, 67, .08); --sfo: #fff; }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  position: fixed; inset: 0; overflow: hidden; background: #071433; color: #fff;
  font: 16px/1.3 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #64d2ff; outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; line-height: 1.4; }
.pad { padding: 14px 18px; }
.wx { display: block; }
.li { flex: none; }

/* ---------- sky ---------- */
.bg { position: fixed; inset: 0; transition: opacity 1.2s ease; opacity: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#app { position: relative; display: flex; height: 100%; z-index: 1; }

/* ---------- layout ---------- */
#stage { position: relative; flex: 1; min-width: 0; height: 100%; }
#pager { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
#pager::-webkit-scrollbar { display: none; }
.page { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; container-type: inline-size; }
.scroll {
  height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: var(--sat) 0 calc(var(--bar-h) + var(--sab) + 18px);
  padding-left: var(--sal); padding-right: var(--sar);
}
.content { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 0 12px; max-width: 1000px; margin: 0 auto; }
.content > * { grid-column: 1 / -1; min-width: 0; }
div.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@container (min-width: 640px) { div.grid { grid-template-columns: repeat(3, 1fr); } }
@container (min-width: 900px) {
  .content > .card.half { grid-column: span 3; }
  div.grid { grid-template-columns: repeat(4, 1fr); }
}

/* collapsing header */
.mini {
  position: absolute; z-index: 6; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 8px) 16px 10px; pointer-events: none;
  opacity: clamp(0, calc((var(--p, 0) - .62) * 3), 1); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  background: linear-gradient(180deg, rgba(0, 0, 0, .22), rgba(0, 0, 0, .06)); text-align: center;
}
.mrow { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.mrow b { font-size: 17px; font-weight: 600; }
.mrow span { font-size: 14px; color: rgba(255, 255, 255, .85); }
.mrow i { font-style: normal; margin: 0 6px; opacity: .5; }

/* ---------- hero ---------- */
.hero { text-align: center; padding: 34px 20px 8px; text-shadow: 0 1px 14px rgba(0, 0, 0, .22); }
.hero > * { opacity: calc(1 - var(--p, 0) * 1.7); }
.htemp { font: 200 clamp(92px, 26vw, 124px)/1 "SF Pro Display", var(--font); letter-spacing: -.045em; margin: 2px 0 0 .1em; transform: translateY(calc(var(--p, 0) * -34px)); opacity: calc(1 - var(--p, 0) * 1.3); font-variant-numeric: tabular-nums; }
.hcity { display: flex; justify-content: center; align-items: center; gap: 6px; }
.hcity h1 { font-size: 32px; font-weight: 400; letter-spacing: -.01em; }
.hcity .loc { width: 16px; height: 16px; opacity: .9; }
.hloc { font-size: 14px; color: rgba(255, 255, 255, .78); min-height: 18px; }
.hcond { font-size: 20px; font-weight: 500; margin-top: -4px; }
.hhl { font-size: 20px; font-weight: 500; }
.cons {
  display: inline-flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 14px; padding: 9px 16px 10px;
  border-radius: 16px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .2); font-size: 12.5px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .35s var(--spring), background .2s; max-width: 100%;
}
.cons:active { transform: scale(.96); }
.cons b { font-weight: 650; }
.cons.high b { color: #8af5ad; } .cons.medium b { color: #ffe27a; } .cons.low b { color: #ffa59f; } .cons.single b { color: #fff; }
.strip { display: block; overflow: visible; }
.chip { display: inline-block; margin: 10px 4px 0; padding: 4px 10px; border-radius: 99px; font-size: 12px; background: rgba(0, 0, 0, .25); }
.chip.warn { background: rgba(255, 159, 10, .3); }
.hsum { max-width: 34ch; margin: 14px auto 4px; font-size: 15.5px; line-height: 1.38; color: rgba(255, 255, 255, .95); }
.skel .htemp { opacity: .35; }

/* pull to refresh */
.ptr { position: relative; height: 0; }
.ptr i { position: absolute; top: 10px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); border-top-color: transparent; opacity: var(--pull, 0); transform: rotate(calc(var(--pull, 0) * 360deg)); }
.page.loading .ptr i { opacity: 1; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cards ---------- */
.card {
  background: var(--glass); border: 1px solid rgba(255, 255, 255, .12); border-radius: 20px; padding: 12px 14px 14px;
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); text-shadow: none; min-width: 0;
}
.card .seg { --sf: rgba(255, 255, 255, .14); --sfo: rgba(255, 255, 255, .32); color: #fff; }
.ct { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; min-height: 26px; }
.ct .seg { margin-left: auto; }
.card.sm { display: flex; flex-direction: column; min-height: 164px; }
.big { font-size: 40px; font-weight: 300; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big.sm { font-size: 30px; }
.lab { font-size: 16px; font-weight: 500; margin-top: 2px; }
.foot { margin-top: auto; padding-top: 8px; font-size: 12.5px; line-height: 1.32; color: rgba(255, 255, 255, .88); }
.note { margin-top: 10px; font-size: 12px; line-height: 1.38; color: var(--muted); }
.lead { font-size: 15px; font-weight: 500; margin-bottom: 8px; }

/* segmented control */
.seg { display: inline-flex; background: var(--sf); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .2s, transform .25s var(--spring); }
.seg button[aria-pressed="true"] { background: var(--sfo); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg button:active { transform: scale(.94); }
.card > .seg { display: flex; margin-bottom: 12px; }
.card > .seg button { flex: 1; padding: 5px 2px; }

/* next 2 hours */
.rtext { font-size: 20px; font-weight: 600; line-height: 1.2; }
.rsub { margin-top: 3px; color: rgba(255, 255, 255, .85); font-size: 14px; }
.rbars { display: flex; align-items: flex-end; gap: 5px; height: 46px; margin-top: 12px; }
.rbars i { flex: 1; border-radius: 3px; background: rgba(255, 255, 255, .22); }
.rbars i.wet { background: #6ec6ff; }
.rbars.dry { opacity: .55; }
.raxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* hourly */
.hscroll { display: flex; gap: 2px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hscroll::-webkit-scrollbar { display: none; }
.hr { flex: 0 0 auto; min-width: 54px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.hr .hl { font-size: 13.5px; font-weight: 500; color: rgba(255, 255, 255, .9); white-space: nowrap; }
.hr .pp { min-height: 13px; font-size: 11.5px; font-weight: 600; color: #8fd9ff; }
.hr b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hr.ev { min-width: 64px; }
.hr.ev b { font-size: 12.5px; }
.hr.ev .li { width: 28px; height: 28px; margin: 3px 0; color: #ffd43b; }

/* chart */
.readout { min-height: 52px; margin-bottom: 2px; }
.rt-main { font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; }
.rt-main small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.rt-sub { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 3px 11px; font-size: 11.5px; margin-top: 3px; }
.chp i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
.chp.drop { opacity: .45; }
.chartbox svg { display: block; touch-action: pan-y; }
.chart text { fill: var(--tx, rgba(255, 255, 255, .62)); font: 10px var(--font); }
.chart .grid { stroke: var(--gl, rgba(255, 255, 255, .13)); stroke-width: 1; }
.chart .band { fill: rgba(255, 255, 255, .2); }
.chart .best { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.chart .nowline { stroke: rgba(255, 255, 255, .55); stroke-dasharray: 3 3; }
.chart .scrubline { stroke: rgba(255, 255, 255, .7); }
.chart .scrubdot { fill: #fff; stroke: rgba(0, 0, 0, .25); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--lgc, rgba(255, 255, 255, .68)); margin-top: 4px; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg-line { width: 14px; height: 2.5px; background: #fff; border-radius: 2px; }
.lg-band { width: 14px; height: 8px; background: rgba(255, 255, 255, .26); border-radius: 2px; }

/* sources compared */
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.shead .big { font-size: 34px; }
.shead small { font-size: 12.5px; color: var(--muted); }
.sconf { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .14); }
.sconf.high { color: #8af5ad; } .sconf.medium { color: #ffe27a; } .sconf.low { color: #ffa59f; }
.srow { display: grid; grid-template-columns: minmax(96px, 120px) 1fr 38px 42px; gap: 8px; align-items: center; padding: 5px 0; }
.sn { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
.trk { position: relative; height: 14px; }
.trk::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .22); }
.trk .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; border-radius: 1px; }
.trk .dot { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, .18); transition: left .45s var(--spring); }
.sv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { font-size: 11px; color: var(--muted); text-align: right; }
.srow.drop { opacity: .5; }
.srow.drop .sv { text-decoration: line-through; }

/* daily */
.drows { margin: 0 -2px; }
.drow {
  display: grid; grid-template-columns: 52px 40px 34px 1fr 34px; gap: 8px; align-items: center; width: 100%; padding: 6px 2px;
  border: 0; border-top: 1px solid rgba(255, 255, 255, .13); background: none; text-align: left;
}
.drow:first-child { border-top: 0; }
.dn { font-size: 17px; font-weight: 500; }
.di { display: flex; flex-direction: column; align-items: center; min-height: 34px; justify-content: center; }
.di small { font-size: 11px; font-weight: 600; color: #8fd9ff; min-height: 12px; line-height: 12px; }
.dl { text-align: right; color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; }
.dh { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .26); }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bar u { position: absolute; top: -1.5px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; border: 1.5px solid rgba(0, 0, 0, .3); }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 8px 2px 12px; font-size: 13px; animation: open .3s var(--spring); }
.dd div { display: flex; flex-direction: column; }
.dd span { color: var(--muted); font-size: 11.5px; }
.dd .full { grid-column: 1 / -1; }
@keyframes open { from { opacity: 0; transform: translateY(-6px); } }

/* small cards */
.ubar, .abar { position: relative; height: 5px; border-radius: 3px; margin-top: 10px; }
.ubar { background: linear-gradient(90deg, #30d158, #ffd60a 35%, #ff9f0a 60%, #ff453a 80%, #bf5af2); }
.abar { background: linear-gradient(90deg, #30d158, #ffd60a 20%, #ff9f0a 40%, #ff453a 60%, #bf5af2 80%, #a2203f); }
.ubar i, .abar i { position: absolute; top: -2px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .35); }
.compass { width: 100%; max-width: 128px; align-self: center; }
.compass .cl { fill: rgba(255, 255, 255, .72); font-size: 8px; text-anchor: middle; }
.compass .cs { fill: #fff; font-size: 20px; font-weight: 600; text-anchor: middle; }
.compass .cu { fill: rgba(255, 255, 255, .72); font-size: 8px; text-anchor: middle; }
.compass .tm { stroke: #fff; stroke-width: 1.5; } .compass .tn { stroke: rgba(255, 255, 255, .35); stroke-width: 1; }
.arc { width: 100%; max-width: 170px; margin-top: 4px; }
.arc .hz { stroke: rgba(255, 255, 255, .35); } .arc .ap { fill: none; stroke: rgba(255, 255, 255, .45); stroke-width: 2; stroke-dasharray: 3 4; }
.moonsvg { width: 56px; height: 56px; margin: 2px 0 4px; }
.plist { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
.plist div { display: flex; justify-content: space-between; font-size: 14px; }
.plist .pl0, .plist .pl1 { color: #8af5ad; } .plist .pl2 { color: #ffe27a; } .plist .pl3 { color: #ffa24d; } .plist .pl4 { color: #ff7a72; }
.rmini { height: 170px; border-radius: 14px; overflow: hidden; cursor: pointer; }
.card.c-radar .foot { margin-top: 0; }

/* report card */
.arow { display: grid; grid-template-columns: minmax(96px, 120px) 1fr 74px; gap: 10px; align-items: center; padding: 5px 0; }
.abarw { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .15); overflow: hidden; }
.abarw i { display: block; height: 100%; border-radius: 3px; transition: width .6s var(--spring); }
.av { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* alerts */
.alert { border-left: 4px solid var(--ac); padding-left: 10px; margin: 8px 0; }
.alert > button { display: block; width: 100%; background: none; border: 0; text-align: left; padding: 2px 0; }
.alert b { display: block; font-size: 15px; } .alert span { font-size: 13px; color: rgba(255, 255, 255, .8); }
.abody { font-size: 13px; white-space: pre-wrap; line-height: 1.4; color: rgba(255, 255, 255, .88); margin-top: 6px; max-height: 260px; overflow: auto; }

.pfoot { text-align: center; color: rgba(255, 255, 255, .66); font-size: 11.5px; line-height: 1.4; padding: 4px 22px 0; }
.pfoot button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 12px; font-size: 13px; color: rgba(255, 255, 255, .85); }

.shimmer .sk { height: 110px; border-radius: 12px; background: linear-gradient(90deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .16), rgba(255, 255, 255, .05)); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border: 0; border-radius: 14px; background: var(--sf); font-weight: 600; font-size: 16px; transition: transform .3s var(--spring); }
.btn:active { transform: scale(.97); }
.btn.wide { width: 100%; margin-top: 8px; justify-content: flex-start; }
.btn.primary { background: #0a84ff; color: #fff; }
.btn.danger { color: #ff6961; }
.card .btn { margin-top: 10px; background: rgba(255, 255, 255, .16); color: #fff; }
.ib { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; transition: transform .3s var(--spring), background .2s; }
.ib:active { transform: scale(.9); background: rgba(255, 255, 255, .15); }
.ib.sm { width: 32px; height: 32px; }
.tb { background: none; border: 0; padding: 8px 6px; color: #0a84ff; font-weight: 600; font-size: 16px; }

/* ---------- bottom bar (phones) ---------- */
#bar {
  position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; height: calc(var(--bar-h) + var(--sab)); padding: 0 calc(10px + var(--sar)) var(--sab) calc(10px + var(--sal));
  display: flex; align-items: center; justify-content: space-between; border-top: .5px solid rgba(255, 255, 255, .2);
  background: rgba(20, 30, 52, .3); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
}

  const d = S.data[id], p = pageEl(id);
  if (!d?.view || !p) return;
  const card = p.querySelector(`[data-card="${name}"]`);
  if (!card) return;
  card.innerHTML = V.renderCard(name, d.view, uiState(id));
  if (name === 'chart') V.mountChart(card, d.view, uiState(id));
}

function renderDots() {
  el.dots.innerHTML = S.cities.map(c => `<button class="dot ${c.id === S.activeId ? 'on' : ''}" data-act="dot" data-id="${esc(c.id)}" aria-label="${esc(c.name)}">${c.isCurrent ? I.locate : ''}</button>`).join('');
}

function renderList() {
  el.clist.innerHTML = S.cities.length
    ? S.cities.map(c => V.listRow(c, S.data[c.id]?.view, { edit: S.edit })).join('')
    : '<p class="muted pad">Add a city to see its forecast.</p>';
  el.clist.querySelector(`[data-id="${CSS.escape(S.activeId || '')}"]`)?.closest('.lrow')?.classList.add('active');
}

function toggleEmpty() {
  const none = !S.cities.length;
  el.empty.hidden = !none; el.pager.hidden = none; el.bar.hidden = none;
  document.body.classList.toggle('no-cities', none);
}

function setActive(id, { scroll = true, instant = false } = {}) {
  if (!cityById(id)) return;
  S.activeId = id;
  saveCities(S.cities, id);
  $$('.page', el.pager).forEach(p => p.classList.toggle('active', p.dataset.id === id));
  renderDots();
  el.clist.querySelectorAll('.lrow').forEach(r => r.classList.toggle('active', r.querySelector('[data-id]')?.dataset.id === id));
  const v = S.data[id]?.view;
  if (v) onActiveView(v);
  if (scroll && !wide.matches) {
    const i = S.cities.findIndex(c => c.id === id);
    if (instant) el.pager.scrollLeft = i * el.pager.clientWidth; else el.pager.scrollTo({ left: i * el.pager.clientWidth, behavior: 'smooth' });
  }
  loadCity(id);
}

// ======================================================= data
async function loadCity(id, { force = false } = {}) {
  const city = cityById(id);
  if (!city || S.loading.has(id)) return;
  if (!S.data[id]) {
    const cached = await idbGet('fc:' + id);
    if (cached) { S.data[id] = { bundle: cached }; renderPage(id); renderList(); }
  }
  if (!navigator.onLine) { renderPage(id); return; }
  const age = S.data[id] ? Date.now() - S.data[id].bundle.fetchedAt : Infinity;
  if (!force && age < STALE_MS) return;

  S.loading.add(id); renderPage(id);
  try {
    const bundle = await fetchBundle(city, S.prefs);
    S.data[id] = { bundle }; delete S.errors[id];
    idbSet('fc:' + id, bundle);
    await learn(id, bundle);
    if (!city.tz && bundle.main.tz) { city.tz = bundle.main.tz; saveCities(S.cities, S.activeId); }
    iosTip();
  } catch (err) {
    console.warn('fetch failed', id, err);
    if (S.data[id]) toast('Couldn’t update. Showing your saved forecast.');
    else S.errors[id] = 'The forecast service didn’t respond.';
  } finally {
    S.loading.delete(id); renderPage(id); renderList();
  }
}

async function learn(id, bundle) {
  const rec = S.acc[id] || (S.acc[id] = (await idbGet('acc:' + id)) || { preds: {}, acc: {} });
  const now = Date.now();
  evaluate(rec.preds, rec.acc, { t: bundle.main.hourly.t, temp: bundle.main.hourly.temp }, now);
  recordPredictions(rec.preds, bundle.sources, now);
  idbSet('acc:' + id, rec);
}

async function refreshAll(force = true) {
  for (const c of S.cities) await loadCity(c.id, { force });
}

function iosTip() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && navigator.standalone === false && !localStorage.getItem('q.tip')) {
    localStorage.setItem('q.tip', '1');
    setTimeout(() => toast('Tip: tap Share, then Add to Home Screen, to keep forecasts offline.', { ms: 9000 }), 1500);
  }
}

// ======================================================= adding / removing cities
function addCity(info, { quiet = false, current = false } = {}) {
  const id = current ? 'here' : cityId(info.lat, info.lon);
  let c = cityById(id);
  if (c) { if (!quiet) { setActive(id); closeList(); } return c; }
  c = { id, name: info.name, admin: info.admin || '', country: info.country || '', lat: +info.lat, lon: +info.lon, tz: info.tz || null, isCurrent: !!current };
  if (current) S.cities.unshift(c); else S.cities.push(c);
  S.acc[id] = S.acc[id] || { preds: {}, acc: {} };
  saveCities(S.cities, S.activeId);
  if (!quiet) {
    syncPages(); renderList(); toggleEmpty();
    S.activeId = id; setActive(id, { instant: false });
    closeList();
  }
  return c;
}

async function removeCity(id) {
  const i = S.cities.findIndex(c => c.id === id);
  if (i < 0) return;
  S.cities.splice(i, 1);
  delete S.data[id]; delete S.acc[id]; delete S.ui[id];
  idbDel('fc:' + id); idbDel('acc:' + id);
  saveCities(S.cities, S.activeId);
  syncPages(); toggleEmpty();
  if (S.activeId === id) {
    const next = S.cities[Math.min(i, S.cities.length - 1)];
    S.activeId = next?.id || null;
    if (next) setActive(next.id, { instant: true });
  }
  renderDots(); renderList();
}

function locate() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('unsupported'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(e), { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60e3 });
  });
}

async function useMyLocation() {
  try {
    toast('Finding your location…');
    const { latitude: lat, longitude: lon } = await locate();
    const place = await reverseGeocode(lat, lon);
    el.toast.classList.remove('show');
    const existing = cityById('here');
    if (existing) { Object.assign(existing, place, { lat, lon }); delete S.data.here; saveCities(S.cities, S.activeId); setActive('here'); loadCity('here', { force: true }); renderList(); }
    else addCity({ ...place, lat, lon }, { current: true });
    closeList();
  } catch {
    toast('Location is turned off. You can search for a city instead.');
  }
}

async function refreshHere() {
  const here = cityById('here');
  if (!here || !navigator.geolocation) return;
  try {
    const perm = await navigator.permissions?.query({ name: 'geolocation' });
    if (perm && perm.state !== 'granted') return;
    const { latitude: lat, longitude: lon } = await locate();
    const moved = Math.hypot((lat - here.lat) * 111, (lon - here.lon) * 111 * Math.cos(lat * Math.PI / 180));
    if (moved > 3) {
      Object.assign(here, await reverseGeocode(lat, lon), { lat, lon });
      saveCities(S.cities, S.activeId); delete S.data.here; renderPage('here'); loadCity('here', { force: true });
    }
  } catch { /* keep the saved position */ }
}

// ======================================================= search
const doSearch = debounce(async text => {
  const out = el.results;
  if (text.trim().length < 2) { out.innerHTML = ''; document.body.classList.remove('searching'); return; }
  document.body.classList.add('searching');
  if (!navigator.onLine) { out.innerHTML = '<p class="muted pad">Searching needs a connection.</p>'; return; }
  out.innerHTML = '<p class="muted pad">Searching…</p>';
  try {
    const r = await searchPlaces(text.trim());
    out.innerHTML = r.length ? r.map(V.searchResult).join('') : '<p class="muted pad">No places found. Try a different spelling.</p>';
  } catch { out.innerHTML = '<p class="muted pad">Search isn’t available right now.</p>'; }
}, 250);

function clearSearch() { el.q.value = ''; el.results.innerHTML = ''; document.body.classList.remove('searching'); }

// ======================================================= lists & sheets
const openList = () => { document.body.classList.add('list-open'); };
const closeList = () => { if (!wide.matches) document.body.classList.remove('list-open'); clearSearch(); };

function openSheet(name) {
  const s = $('#sheet-' + name);
  s.hidden = false;
  requestAnimationFrame(() => s.classList.add('open'));
  document.body.classList.add('modal');
  if (name === 'settings') renderSettings();
  if (name === 'compare') openCompare();
  if (name === 'radar') openRadar();
}
function closeSheet(name) {
  const s = $('#sheet-' + name);
  s.classList.remove('open');
  setTimeout(() => { s.hidden = true; if (!$$('.sheet.open').length) document.body.classList.remove('modal'); }, 320);
  if (name === 'radar') { S.radar?.destroy(); S.radar = null; }
  if (name === 'settings' && S.needsRefresh) { S.needsRefresh = false; refreshAll(true); }
}

// ---- settings
function renderSettings() {
  $('#settingsBody').innerHTML = V.settings(S.prefs, { persisted: S.persisted, version: VERSION });
}

function onSettingsClick(e) {
  const seg = e.target.closest('.seg[data-pref] button');
  if (seg) {
    const key = seg.parentElement.dataset.pref;
    S.prefs[key] = seg.dataset.v; savePrefs(S.prefs);
    $$('button', seg.parentElement).forEach(b => b.setAttribute('aria-pressed', String(b === seg)));
    if (key === 'theme') applyTheme();
    renderAll();
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  switch (b.dataset.act) {
    case 'glance': closeSheet('settings'); openGlance(); break;
    case 'share': shareCity(); break;
    case 'refresh-all': toast('Refreshing every city…'); refreshAll(true); break;
    case 'clear-cache':
      Object.keys(S.data).forEach(id => idbDel('fc:' + id)); toast('Saved forecasts cleared. They will reload from the network.');
      caches?.keys().then(ks => ks.filter(k => k.includes('tiles')).forEach(k => caches.delete(k)));
      break;
    case 'clear-acc':
      S.cities.forEach(c => { S.acc[c.id] = { preds: {}, acc: {} }; idbSet('acc:' + c.id, S.acc[c.id]); });
      renderAll(); toast('Accuracy history reset.');
      break;
  }
}
function onSettingsChange(e) {
  const t = e.target;
  if (t.dataset.src) {
    if (t.checked) { delete S.prefs.sources[t.dataset.src]; S.needsRefresh = true; } else S.prefs.sources[t.dataset.src] = false;
    savePrefs(S.prefs); renderAll();
  } else if (t.id === 'key-owm' || t.id === 'key-wapi') {
    S.prefs.keys[t.id.slice(4)] = t.value.trim(); savePrefs(S.prefs); S.needsRefresh = true;
  }
}
const applyBias = debounce(() => { savePrefs(S.prefs); renderAll(); }, 120);
function onSettingsInput(e) {
  if (e.target.id !== 'feelBias') return;
  const v = +e.target.value; S.prefs.feelBias = v;
  $('#feelOut').textContent = v === 0 ? 'Neutral' : (v > 0 ? '+' : '−') + Math.abs(v) + '°C';
  applyBias();
}

// ---- share & glance
async function shareCity() {
  const v = activeView(); if (!v) return;
  const c = v.city;
  const url = `${BASE}?lat=${c.lat.toFixed(3)}&lon=${c.lon.toFixed(3)}&n=${encodeURIComponent(c.name)}`;
  const text = `${c.name}: ${v.fmt.temp(v.hero.best)}, ${wmo(v.cur.code).label}. ${v.summary}`;
  try {
    if (navigator.share) await navigator.share({ title: `Weather in ${c.name}`, text, url });
    else { await navigator.clipboard.writeText(`${text} ${url}`); toast('Forecast link copied.'); }
  } catch { /* cancelled */ }
}

async function openGlance() {
  if (!activeView()) { toast('Load a forecast first.'); return; }
  el.glance.hidden = false; renderGlance();
  requestAnimationFrame(() => el.glance.classList.add('open'));
  try { S.wake = await navigator.wakeLock?.request('screen'); } catch { /* not allowed */ }
}
function closeGlance() {
  el.glance.classList.remove('open');
  setTimeout(() => { el.glance.hidden = true; }, 250);
  S.wake?.release?.().catch(() => {}); S.wake = null;
}
function renderGlance() {
  const v = activeView(); if (!v) return;
  const f = v.fmt, t = v.today;
  el.glance.innerHTML = `<div class="gl"><div class="gcity">${esc(v.city.name)}</div><div class="gtemp">${f.temp(v.hero.best)}</div>
    <div class="gcond">${wmo(v.cur.code).label}</div><div class="ghl">H:${f.temp(t?.hi ?? v.hero.best)}  L:${f.temp(t?.lo ?? v.hero.best)}</div>
    <div class="grain">${v.rain ? esc(v.rain.text) : esc(v.summary)}</div>
    <div class="gconf">${v.hero.n > 1 ? `${v.hero.n} sources · ${v.hero.conf.label.toLowerCase()}` : 'single source'}</div><div class="ghint">Tap anywhere to close</div></div>`;
}

// ---- compare
function openCompare() {
  const ids = S.cities.filter(c => S.data[c.id]?.view).map(c => c.id);
  const c = S.cmp;
  if (!ids.includes(c.a)) c.a = S.activeId && ids.includes(S.activeId) ? S.activeId : ids[0];
  if (!ids.includes(c.b) || c.b === c.a) c.b = ids.find(i => i !== c.a) || c.a;
  if (ids.length < 2) c.mode = 'days';
  if (c.mode === 'days') { c.a = 0; c.b = 1; c.dayCity = S.activeId; }
  renderCompare();
}

function renderCompare() {
  const c = S.cmp;
  const cityList = S.cities.filter(x => S.data[x.id]?.view).map(x => [x.id, x.name]);
  let dayList = [];
  if (c.mode === 'days') {
    const v = S.data[S.activeId]?.view;
    if (v) dayList = v.days.map((d, k) => [k, `${d.isToday ? 'Today' : v.fmt.wk(d.t + 12 * HOUR)} ${v.fmt.day(d.t + 12 * HOUR)}`]);
  }
  const body = $('#compareBody');
  body.innerHTML = V.compareShell(cityList, dayList, c);
  const rows = c.mode === 'cities' ? cityRows(c.a, c.b) : dayRows(+c.a, +c.b);
  if (!rows) { body.querySelector('.cbody').innerHTML = '<p class="muted pad">Pick two to compare.</p>'; return; }
  body.querySelector('.cbody').innerHTML = V.compareBody(rows.table);
  drawCompare(body.querySelector('.cchart'), rows.series, { fmt: rows.fmt, xLabel: rows.xLabel });
  const lg = rows.series.map((s, i) => `<span><i class="${i ? 'cB' : 'cA'}"></i>${esc(s.label)}</span>`).join('');
  body.querySelector('.cchart').insertAdjacentHTML('afterend', `<div class="legend">${lg}</div>`);
}

function cityRows(a, b) {
  const A = S.data[a]?.view, B = S.data[b]?.view;
  if (!A || !B) return null;
  const col = v => {
    const f = v.fmt, t = v.today;
    return [f.temp(v.hero.best), `${f.temp(t.hi)} / ${f.temp(t.lo)}`, f.temp(v.feels), `${t.pop}%`, f.precip(t.precipSum), f.wind(v.cur.wind), t.uvMax != null ? String(Math.round(t.uvMax)) : '–', v.hero.n > 1 ? v.hero.conf.label.replace(' confidence', '') : 'Single source'];
  };
  const labels = ['Now', 'High / low', 'Feels like', 'Rain chance', 'Rain today', 'Wind', 'UV peak', 'Sources agree'];
  const ca = col(A), cb = col(B);
  return {
    table: labels.map((l, i) => [l, ca[i], cb[i]]), fmt: A.fmt, xLabel: i => (i === 0 ? 'Now' : `+${i}h`),
    series: [{ label: A.city.name, color: '#5ac8fa', v: A.hourly.map(h => h.temp) }, { label: B.city.name, color: '#ff9f0a', v: B.hourly.map(h => h.temp) }],
  };
}

function dayRows(a, b) {
  const v = S.data[S.activeId]?.view; if (!v) return null;
  const A = v.days[a], B = v.days[b]; if (!A || !B) return null;
  const f = v.fmt, rng = r => (r ? `${f.temp(r[0])}–${f.temp(r[1])}` : '–');
  const sr = d => d.idx.map(i => v.series.best[i]);
  const n = Math.min(A.idx.length, B.idx.length, 24);
  const row = (l, g) => [l, g(A), g(B)];
  return {
    table: [row('High', d => f.temp(d.hi)), row('Low', d => f.temp(d.lo)), row('Sources’ high', d => rng(d.hiRange)), row('Rain chance', d => `${d.pop}%`),
      row('Rain total', d => f.precip(d.precipSum)), row('Wind up to', d => f.wind(d.windMax)), row('UV peak', d => (d.uvMax != null ? String(Math.round(d.uvMax)) : '–'))],
    fmt: f, xLabel: i => f.hour(v.H.t[A.idx[i]]),
    series: [
      { label: `${A.isToday ? 'Today' : f.wk(A.t + 12 * HOUR)}`, color: '#5ac8fa', v: sr(A).slice(0, n) },
      { label: `${B.isToday ? 'Today' : f.wk(B.t + 12 * HOUR)}`, color: '#ff9f0a', v: sr(B).slice(0, n) },
    ],
  };
}

// ---- radar
async function openRadar() {
  const v = activeView(); if (!v) { closeSheet('radar'); toast('Load a forecast first.'); return; }
  await new Promise(r => setTimeout(r, 60)); // let the sheet lay out so the map has a size
  const box = $('#radarMap'), time = $('#rtime'), slider = $('#rslider'), play = $('#rplay');
  S.radar?.destroy();
  const m = S.radar = new RadarMap(box, {
    lat: v.city.lat, lon: v.city.lon, zoom: 6,
    onFrame: (t, i, fc) => { time.textContent = `${v.fmt.time(t)}${fc ? ' · forecast' : ''}`; slider.value = i; },
  });
  const ok = await m.load();
  slider.max = Math.max(0, m.layers.length - 1);
  play.disabled = !ok;
  if (ok) { m.play(); play.setAttribute('aria-pressed', 'true'); }
}

// ======================================================= events
function bind() {
  // pager scroll → active city (phones)
  el.pager.addEventListener('scroll', debounce(() => {
    if (wide.matches || !el.pager.clientWidth) return;
    const c = S.cities[Math.round(el.pager.scrollLeft / el.pager.clientWidth)];
    if (c && c.id !== S.activeId) setActive(c.id, { scroll: false });
  }, 70), { passive: true });

  // page interactions
  el.pager.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const page = b.closest('.page'), id = page?.dataset.id; if (!id) return;
    const st = uiState(id), v = S.data[id]?.view;
    switch (b.dataset.act) {
      case 'chart-h': st.h = b.dataset.v; rerenderCard(id, 'chart'); break;
      case 'src-off': st.off = +b.dataset.v; rerenderCard(id, 'sources'); break;
      case 'day': { const k = +b.dataset.v; st.day = st.day === k ? null : k; rerenderCard(id, 'daily'); break; }
      case 'alert': { const k = +b.dataset.v; st.alertOpen = st.alertOpen === k ? null : k; rerenderCard(id, 'alerts'); break; }
      case 'refresh': loadCity(id, { force: true }); break;
      case 'to-sources': page.querySelector('[data-card="sources"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
      case 'open-radar': if (v) openSheet('radar'); break;
    }
  });

  // toolbar & list
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act], [data-open], [data-close]');
    if (!b) return;
    if (b.dataset.open) { openSheet(b.dataset.open); return; }
    if (b.dataset.close) { closeSheet(b.dataset.close); return; }
    switch (b.dataset.act) {
      case 'list': openList(); break;
      case 'list-close': closeList(); break;
      case 'dot': case 'pick': setActive(b.dataset.id); closeList(); break;
      case 'del': removeCity(b.dataset.id); break;
      case 'edit': S.edit = !S.edit; $('#btnEdit').textContent = S.edit ? 'Done' : 'Edit'; renderList(); break;
      case 'add': addCity({ name: b.dataset.name, admin: b.dataset.admin, country: b.dataset.country, lat: +b.dataset.lat, lon: +b.dataset.lon }); clearSearch(); break;
      case 'locate': useMyLocation(); break;
      case 'focus-search': openList(); setTimeout(() => el.q.focus(), 80); break;
      case 'glance-close': closeGlance(); break;
      case 'cmp-mode': S.cmp.mode = b.dataset.v; S.cmp.a = S.cmp.mode === 'days' ? 0 : null; S.cmp.b = S.cmp.mode === 'days' ? 1 : null; openCompare(); break;
      case 'r-play': if (S.radar) { if (S.radar.playing) { S.radar.pause(); b.setAttribute('aria-pressed', 'false'); } else { S.radar.play(); b.setAttribute('aria-pressed', 'true'); } } break;
      case 'r-zoom': S.radar?.setZoom(S.radar.z + +b.dataset.v); break;
      case 'r-center': S.radar?.recenter(); break;
    }
  });
  el.glance.addEventListener('click', closeGlance);

  el.q.addEventListener('input', () => doSearch(el.q.value));
  el.q.addEventListener('keydown', e => { if (e.key === 'Enter') el.results.querySelector('.sres')?.click(); });

  const sb = $('#settingsBody');
  sb.addEventListener('click', onSettingsClick); sb.addEventListener('change', onSettingsChange); sb.addEventListener('input', onSettingsInput);

  $('#compareBody').addEventListener('change', e => {
    const k = e.target.dataset.cmp; if (!k) return;
    S.cmp[k] = e.target.value; renderCompare();
  });
  $('#rslider').addEventListener('input', e => { S.radar?.pause(); $('#rplay').setAttribute('aria-pressed', 'false'); S.radar?.show(+e.target.value); });

  addEventListener('keydown', e => { if (e.key === 'Escape') { $$('.sheet.open').forEach(s => closeSheet(s.id.replace('sheet-', ''))); if (!el.glance.hidden) closeGlance(); closeList(); } });
  addEventListener('online', () => { toast('Back online. Updating…'); rerenderActive(); refreshAll(false); });
  addEventListener('offline', () => { toast('You’re offline. Showing saved forecasts.'); rerenderActive(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    rerenderActive();
    if (S.activeId) loadCity(S.activeId);
  });
  wide.addEventListener('change', () => { document.body.classList.remove('list-open'); if (S.activeId) setActive(S.activeId, { instant: true }); });
}

// ======================================================= service worker
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  addEventListener('load', async () => {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w?.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) toast('A new version is ready.', { label: 'Reload', onClick: () => { w.postMessage('SKIP_WAITING'); } });
        });
      });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
      setInterval(() => reg.update().catch(() => {}), 60 * 60e3);
    } catch (e) { console.warn('SW registration failed', e); }
  });
}

init();

return {  };
})();
